<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transplant Bundle — Billed Charges Roll-up</title>
<style>
  :root { --line:#e2e2dd; --bg:#faf9f5; --ok:#1d7a4d; --okbg:#e7f4ec; --bad:#b3261e; --badbg:#fbeaea; --warn:#9a6a00; --warnbg:#fbf1da; --muted:#6b6b66; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; color:#23231f; background:var(--bg); }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:700; }
  header a { margin-left:auto; font-size:13px; color:var(--muted); }
  main { padding:20px 22px; max-width:1080px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .k { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .card .v { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:4px; }
  .card .v.pos { color:var(--bad); } .card .v.neg { color:var(--ok); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; }
  td.num, th.num { text-align:right; }
  tr.total td { font-weight:700; border-top:2px solid #23231f; border-bottom:0; }
  tr.flag td { background:var(--warnbg); }
  .badge { font-size:11px; padding:2px 7px; border-radius:6px; font-weight:600; }
  .badge.ok { background:var(--okbg); color:var(--ok); }
  .badge.bad { background:var(--badbg); color:var(--bad); }
  .badge.warn { background:var(--warnbg); color:var(--warn); }
  a.view { font-size:12px; color:#185fa5; }
  .mtoggle { font-size:10px; padding:1px 5px; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; font-weight:600; }
  .mtoggle.on { background:#23231f; color:#fff; border-color:#23231f; }
  .uploadbar { padding:12px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; }
  .uploadbar button { padding:6px 12px; border:1px solid #23231f; border-radius:8px; background:#23231f; color:#fff; cursor:pointer; font-size:13px; }
  .uploadbar button.secondary { background:#fff; color:#23231f; }
  #ustatus { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Transplant Bundle — Billed Charges Roll-up</h1>
  <a href="/">← Single-claim viewer</a>
</header>
<div class="uploadbar">
  <strong>Process a bundle:</strong>
  <input type="file" id="files" multiple accept="application/pdf" />
  <button id="processBtn">Upload &amp; process</button>
  <button id="sampleBtn" class="secondary">Sample bundle</button>
  <span id="ustatus"></span>
</div>
<main id="main">Loading…</main>

<script>
const money = n => "$" + Number(n).toLocaleString("en-US",{minimumFractionDigits:2});
const money4 = n => "$" + Number(n).toFixed(4);
let costModel = "haiku";
let bundleData = null;

async function load() {
  bundleData = await (await fetch("/api/bundle")).json();
  render();
}
function setCostModel(m) { costModel = m; render(); }

function render() {
  const d = bundleData;
  const varCls = d.variance >= 0 ? "pos" : "neg";
  const varTxt = (d.variance >= 0 ? "+" : "") + money(d.variance);

  const cards = `<div class="cards">
    <div class="card"><div class="k">Grand total billed</div><div class="v">${money(d.grandTotal)}</div></div>
    <div class="card"><div class="k">Contracted case rate</div><div class="v">${money(d.caseRate)}</div></div>
    <div class="card"><div class="k">Variance</div><div class="v ${varCls}">${varTxt}</div></div>
    <div class="card"><div class="k">Documents</div><div class="v">${d.documentCount}</div></div>
    <div class="card"><div class="k">Need review</div><div class="v">${d.reviewCount}</div></div>
    <div class="card"><div class="k">Tokens used</div><div class="v">${d.tokenTotal}</div></div>
    <div class="card"><div class="k">Token cost
      <button class="mtoggle ${costModel==='haiku'?'on':''}" data-m="haiku">Haiku</button><button class="mtoggle ${costModel==='sonnet'?'on':''}" data-m="sonnet">Sonnet</button></div>
      <div class="v">${money4(d.tokenCost[costModel])}</div></div>
  </div>`;

  const catRows = d.byCategory.map(c => `<tr><td>${c.key}</td><td class="num">${c.count}</td><td class="num">${money(c.charge)}</td></tr>`).join("");
  const provRows = d.byProvider.map(p => `<tr><td>${p.key}</td><td class="num">${money(p.charge)}</td></tr>`).join("");

  const rollups = `<div class="grid2">
    <div class="panel"><h2>By service category</h2>
      <table><thead><tr><th>Category</th><th class="num">Docs</th><th class="num">Billed</th></tr></thead>
        <tbody>${catRows}
          <tr class="total"><td>Total</td><td class="num">${d.documentCount}</td><td class="num">${money(d.grandTotal)}</td></tr></tbody></table></div>
    <div class="panel"><h2>By provider</h2>
      <table><thead><tr><th>Provider</th><th class="num">Billed</th></tr></thead>
        <tbody>${provRows}</tbody></table></div>
  </div>`;

  const docRows = d.documents.map(x => `<tr class="${x.needsReview.length?'flag':''}">
    <td>${x.formType}</td><td>${x.provider}</td><td>${x.category}</td>
    <td>${x.npi} ${x.npiValid===false?'<span class="badge bad">NPI?</span>':''}</td>
    <td class="num">${money(x.charge)}</td>
    <td>${x.needsReview.length?`<span class="badge warn">review</span>`:`<span class="badge ok">ok</span>`}</td>
    <td class="num">${x.tokens}</td>
    <td><a class="view" href="${x.image}" target="_blank">view</a></td></tr>`).join("");
  const docs = `<div class="panel"><h2>Documents in bundle</h2>
    <table><thead><tr><th>Form</th><th>Provider</th><th>Category</th><th>Billing NPI</th>
      <th class="num">Billed</th><th>Status</th><th class="num">Tokens</th><th></th></tr></thead>
      <tbody>${docRows}
        <tr class="total"><td colspan="4">Grand total billed</td><td class="num">${money(d.grandTotal)}</td>
          <td></td><td class="num">${d.tokenTotal}</td><td></td></tr></tbody></table></div>`;

  document.getElementById("main").innerHTML = cards + rollups + docs;
  document.querySelectorAll(".mtoggle").forEach(b => b.onclick = () => setCostModel(b.dataset.m));
}

function setStatus(t) { document.getElementById("ustatus").textContent = t || ""; }

async function processUpload() {
  const input = document.getElementById("files");
  if (!input.files.length) { setStatus("Choose one or more PDF files first."); return; }
  setStatus("Processing " + input.files.length + " file(s)… OCR can take ~10–30s.");
  document.getElementById("main").innerHTML = "Processing…";
  const fd = new FormData();
  for (const f of input.files) fd.append("files", f);
  try {
    const r = await fetch("/api/bundle/upload", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok || d.error) { setStatus("Error: " + (d.error || r.status)); return; }
    bundleData = d;
    setStatus("Processed " + d.documentCount + " document(s) from your upload.");
    render();
  } catch (e) { setStatus("Upload failed: " + e); }
}

document.getElementById("processBtn").onclick = processUpload;
document.getElementById("sampleBtn").onclick = () => { setStatus("Showing sample bundle."); load(); };
load();
</script>
</body>
</html>
